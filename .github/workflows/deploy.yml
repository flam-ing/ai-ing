name: Deploy to Cloudflare Pages (manual)

# ⚠️ 기본 배포 경로는 로컬의 ./scripts/deploy.sh 입니다.
#
# 이 워크플로는 자동 실행을 끈 상태입니다. 저장소 시크릿 CLOUDFLARE_API_TOKEN 이
# 무효(Authentication error, code 10000)라 2026-07-30 이후 push 마다 실패하고 있었고,
# 그래서 로컬에서 `wrangler pages deploy .` 를 쓰게 되면서
# git 이 추적하지 않는 AI_ING_SECURE_VAULT.md(마스터 시크릿)가 공개 배포되는 사고가 났습니다.
#
# 다시 활성화하려면:
#   1) Cloudflare 대시보드에서 API 토큰 생성 (권한: Account > Cloudflare Pages > Edit)
#   2) GitHub 저장소 Settings > Secrets and variables > Actions 에서
#      CLOUDFLARE_API_TOKEN 값을 교체
#   3) 아래 on: 에 push 트리거를 다시 추가
#
# 그때까지는 로컬에서:
#   ./scripts/deploy.sh            # 커밋된 파일만 배포 (시크릿 유출 방지 게이트 포함)
#   ./scripts/deploy.sh --dry-run  # 배포될 파일 목록만 확인

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # `pages deploy .` 는 디렉터리의 모든 파일을 업로드한다.
      # git archive 로 커밋된 파일만(.gitattributes export-ignore 적용) 추출해
      # 시크릿·내부 스크립트가 배포에 섞이지 않도록 한다.
      - name: Build clean deploy directory
        run: |
          mkdir -p dist
          git archive HEAD | tar -x -C dist
          echo "배포 대상 파일 수: $(find dist -type f | wc -l)"
          if find dist -type f \( -iname "*vault*" -o -iname "*secret*" -o -name ".env*" -o -name ".dev.vars" \) | grep -q .; then
            echo "::error::배포 대상에 시크릿 의심 파일이 포함되어 있습니다."
            find dist -type f \( -iname "*vault*" -o -iname "*secret*" -o -name ".env*" -o -name ".dev.vars" \)
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=ai-ing --branch=main
