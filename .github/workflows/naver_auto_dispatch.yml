name: Naver SmartStore 30-Min Auto Dispatch

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  auto-dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests bcrypt python-dotenv urllib3

      - name: Check Egress IP
        run: |
          echo "🌐 GitHub Action Outbound Public IP:"
          curl -s -x "http://pwrbxevg:ee0kdagkuu3a@38.154.185.97:6370" https://api.ipify.org
          echo ""

      - name: Run Naver SmartStore Auto Dispatch
        env:
          FIXED_PROXY_URL: "http://pwrbxevg:ee0kdagkuu3a@38.154.185.97:6370"
        run: |
          python naver_smartstore_auto_dispatch.py
