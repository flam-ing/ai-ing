<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>신용카드 안심 결제 | AI-ing (에이아잉)</title>
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <meta name="robots" content="noindex, nofollow">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  
  <script src="https://cdn.portone.io/v2/browser-sdk.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background: #07080d;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
      -webkit-font-smoothing: antialiased;
    }

    .pay-container {
      width: 100%;
      max-width: 440px;
      background: #0f121a;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 40px rgba(230, 24, 98, 0.08);
      overflow: hidden;
      text-align: center;
      padding: 36px 28px;
      position: relative;
    }

    .brand-logo {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      margin-bottom: 14px;
    }

    .item-name {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 6px;
      font-weight: 500;
    }

    .amount-display {
      font-size: 36px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 20px;
      letter-spacing: -0.02em;
    }

    .amount-display span {
      font-size: 22px;
      color: #e61862;
      font-weight: 700;
      margin-left: 3px;
    }

    .status-text {
      font-size: 14.5px;
      color: #94a3b8;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: #e61862;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 24px;
    }

    .btn-action {
      width: 100%;
      padding: 15px;
      background: #e61862;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15.5px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      box-shadow: 0 8px 24px rgba(230, 24, 98, 0.35);
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-action:hover {
      background: #ff2572;
      box-shadow: 0 10px 28px rgba(230, 24, 98, 0.45);
      transform: translateY(-1px);
    }

    .input-wrapper {
      margin-bottom: 18px;
      text-align: left;
    }

    .input-wrapper label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 6px;
    }

    .input-box {
      width: 100%;
      padding: 12px 14px;
      background: #181c27;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      font-family: inherit;
      outline: none;
    }

    .input-box:focus {
      border-color: #e61862;
    }

    .info-footer {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 11.5px;
      color: #64748b;
      line-height: 1.6;
    }

    /* Success Overlay */
    .success-box {
      display: none;
      text-align: center;
    }

    .check-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid #10b981;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #10b981;
      font-size: 22px;
      margin: 0 auto 16px;
    }

    .receipt-table {
      background: #181c27;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 14px 16px;
      margin: 18px 0 22px;
      text-align: left;
      font-size: 13px;
      line-height: 1.8;
    }

    .receipt-row {
      display: flex;
      justify-content: space-between;
    }

    .receipt-label { color: #64748b; }
    .receipt-val { font-weight: 600; color: #fff; }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="pay-container">
    <img src="logo.png" alt="AI-ing" class="brand-logo">
    <div class="item-name" id="display-item-name">맞춤형 결제 서비스</div>
    <div class="amount-display" id="display-amount">0<span>원</span></div>

    <!-- Active Loading / Calling PG -->
    <div id="calling-box">
      <div class="spinner"></div>
      <div class="status-text" id="status-message">신용카드 결제창을 연결하고 있습니다...</div>
    </div>

    <!-- Fallback / Retry UI (shown if cancelled or no price in URL) -->
    <div id="retry-box" style="display:none;">
      <!-- If no price in URL, allow typing amount -->
      <div class="input-wrapper" id="amount-input-wrap" style="display:none;">
        <label for="manual-amount">결제 금액 (원)</label>
        <input type="number" id="manual-amount" class="input-box" placeholder="예: 200000" min="1000" step="1000" oninput="onAmountInput(this.value)">
      </div>

      <button type="button" class="btn-action" id="btn-retry" onclick="triggerCardPayment()">
        신용카드 결제창 열기
      </button>
    </div>

    <!-- Success Box -->
    <div class="success-box" id="success-box">
      <div class="check-icon">✓</div>
      <h3 style="font-size: 18px; font-weight:700; color:#fff; margin-bottom:4px;">결제가 완료되었습니다!</h3>
      <p style="font-size: 13px; color:#94a3b8;">승인 처리가 정상적으로 완료되었습니다.</p>
      
      <div class="receipt-table">
        <div class="receipt-row"><span class="receipt-label">주문번호</span><span class="receipt-val" id="rec-id" style="font-family:monospace; color:#8c82ff;">-</span></div>
        <div class="receipt-row"><span class="receipt-label">결제상품</span><span class="receipt-val" id="rec-item">-</span></div>
        <div class="receipt-row"><span class="receipt-label">결제금액</span><span class="receipt-val" id="rec-amt" style="color:#e61862; font-weight:700;">-</span></div>
        <div class="receipt-row"><span class="receipt-label">결제수단</span><span class="receipt-val">신용카드</span></div>
      </div>

      <a href="https://ai-ing.org" style="display:inline-block; width:100%; padding:12px; background:#1e293b; color:#fff; border-radius:6px; text-decoration:none; font-size:13.5px; font-weight:600;">홈으로 이동</a>
    </div>

    <div class="info-footer">
      에이아잉 (AI-ing) | 대표: 김민우 | 사업자번호: 102-36-54285<br>
      포트원(PortOne) & KG이니시스 256-bit SSL 보안 결제
    </div>
  </div>

  <script>
    const CONFIG = {
      storeId: "store-f97f9c9a-054d-49f0-8c13-b5c59676bbcf",
      cardChannelKey: "channel-key-e03c26ff-03b9-4b7f-b030-35b1c9c63235",
      apiBase: "https://payment.ai-ing.org"
    };

    let targetAmount = 0;
    let targetItem = "에이아잉 맞춤형 결제";
    let buyerName = "익명 구매자";
    let buyerPhone = "010-0000-0000";
    let buyerEmail = "contact@ai-ing.org";

    function init() {
      const params = new URLSearchParams(window.location.search);
      
      // Amount / Price
      const rawPrice = params.get("price") || params.get("amount");
      if (rawPrice && !isNaN(rawPrice) && Number(rawPrice) >= 1000) {
        targetAmount = Number(rawPrice);
      }

      // Title / Item
      const rawTitle = params.get("title") || params.get("item");
      if (rawTitle && rawTitle.trim()) {
        targetItem = rawTitle.trim();
      }

      // Customer Info (Optional)
      const rawName = params.get("name");
      if (rawName && rawName.trim()) buyerName = rawName.trim();

      const rawPhone = params.get("phone");
      if (rawPhone && rawPhone.trim()) buyerPhone = rawPhone.trim();

      const rawEmail = params.get("email");
      if (rawEmail && rawEmail.trim()) buyerEmail = rawEmail.trim();

      // UI Update
      document.getElementById("display-item-name").innerText = targetItem;

      if (targetAmount >= 1000) {
        document.getElementById("display-amount").innerHTML = `${targetAmount.toLocaleString()}<span>원</span>`;
        document.getElementById("status-message").innerText = `${targetAmount.toLocaleString()}원 신용카드 결제창을 불러오는 중입니다...`;
        
        // ⚡ 바로 결제창 호출! (사용자 클릭 없이 즉시 호출)
        setTimeout(() => {
          triggerCardPayment();
        }, 300);
      } else {
        // 금액이 없는 경우 직접 입력 UI 표시
        document.getElementById("calling-box").style.display = "none";
        document.getElementById("retry-box").style.display = "block";
        document.getElementById("amount-input-wrap").style.display = "block";
        document.getElementById("btn-retry").innerText = "결제 금액을 입력해 주세요";
      }
    }

    function onAmountInput(val) {
      const num = Number(val);
      if (!isNaN(num) && num >= 1000) {
        targetAmount = num;
        document.getElementById("display-amount").innerHTML = `${num.toLocaleString()}<span>원</span>`;
        document.getElementById("btn-retry").innerText = `${num.toLocaleString()}원 신용카드 결제창 열기 ➔`;
      } else {
        targetAmount = 0;
        document.getElementById("display-amount").innerHTML = `0<span>원</span>`;
        document.getElementById("btn-retry").innerText = "1,000원 이상 입력해 주세요";
      }
    }

    async function triggerCardPayment() {
      if (!targetAmount || targetAmount < 1000) {
        alert("결제 금액은 최소 1,000원 이상이어야 합니다.");
        return;
      }

      document.getElementById("calling-box").style.display = "block";
      document.getElementById("retry-box").style.display = "none";
      document.getElementById("status-message").innerText = "신용카드 결제창을 연결 중입니다...";

      try {
        // 1. 주문 생성
        const orderRes = await fetch(`${CONFIG.apiBase}/api/v1/orders`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            amount: targetAmount,
            currency: "KRW",
            itemName: targetItem,
            locale: "ko",
            region: "domestic",
            customer: {
              fullName: buyerName,
              phoneNumber: buyerPhone,
              email: buyerEmail
            }
          })
        });

        const orderData = await orderRes.json();
        if (!orderData.ok) {
          throw new Error(orderData.message || "주문 생성 실패");
        }

        const orderId = orderData.order.id;

        // 2. 포트원 신용카드 결제창 호출 (iframe 즉시 팝업)
        const response = await PortOne.requestPayment({
          storeId: CONFIG.storeId,
          channelKey: CONFIG.cardChannelKey,
          paymentId: orderId,
          orderName: targetItem,
          totalAmount: targetAmount,
          currency: "CURRENCY_KRW",
          payMethod: "CARD",
          customer: {
            fullName: buyerName,
            phoneNumber: buyerPhone,
            email: buyerEmail
          },
          windowType: {
            iframe: {}
          }
        });

        if (response.code != null) {
          // 취소 또는 실패
          document.getElementById("calling-box").style.display = "none";
          document.getElementById("retry-box").style.display = "block";
          document.getElementById("btn-retry").innerText = `${targetAmount.toLocaleString()}원 신용카드 결제 다시 열기 ➔`;
          
          if (!response.message?.includes("취소")) {
            alert(`결제 오류: ${response.message || response.code}`);
          }
          return;
        }

        // 3. 승인 검증
        await fetch(`${CONFIG.apiBase}/api/v1/orders/${orderId}/payment-attempts/portone`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            paymentId: response.paymentId,
            txId: response.txId || response.paymentId,
            method: "card"
          })
        });

        // 4. 완료 화면 표시
        document.getElementById("calling-box").style.display = "none";
        document.getElementById("retry-box").style.display = "none";
        document.getElementById("rec-id").innerText = orderId;
        document.getElementById("rec-item").innerText = targetItem;
        document.getElementById("rec-amt").innerText = `${targetAmount.toLocaleString()}원`;
        document.getElementById("success-box").style.display = "block";

      } catch (e) {
        console.error("Payment error:", e);
        document.getElementById("calling-box").style.display = "none";
        document.getElementById("retry-box").style.display = "block";
        document.getElementById("btn-retry").innerText = `${targetAmount.toLocaleString()}원 결제 다시 열기`;
        alert("결제 창 호출 중 문제가 발생했습니다: " + e.message);
      }
    }

    window.addEventListener("DOMContentLoaded", init);
  </script>
</body>
</html>
